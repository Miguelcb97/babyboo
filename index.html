<title>Una pregunta para ti</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&display=swap">
<style>
/* Concepto: una sola pantalla de celular. Collage de fotos tipo polaroid, se desenfoca,
   pasan las frases una a una y al final queda solo la pregunta. */
:root {
  --lila: #d9ccf5;
  --lila-fuerte: #9a86d8;
  --azul: #cfe3fb;
  --azul-fuerte: #6e9fdb;
  --tinta: #4b4574;
  --papel: #fdfcff;
  --fondo-a: #e8defb;
  --fondo-b: #d3e6fc;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --mano: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: linear-gradient(165deg, var(--fondo-a), var(--fondo-b));
  background-color: var(--fondo-a);
  color: var(--tinta);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
.escena { position: relative; height: 100%; }

/* Burbujas de fondo */
.bruma { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.bruma i { position: absolute; border-radius: 50%; filter: blur(40px); opacity: .55; }
.bruma i:nth-child(1) { width: 60vmin; height: 60vmin; left: -20vmin; top: -10vmin; background: var(--lila); }
.bruma i:nth-child(2) { width: 70vmin; height: 70vmin; right: -25vmin; bottom: -15vmin; background: var(--azul); }

/* Collage */
.collage {
  position: absolute; inset: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding-block: 4svh;
  transition: filter 1.4s ease, opacity 1.4s ease, transform 1.4s ease;
}
.escena.tenue .collage { filter: blur(7px); opacity: .5; transform: scale(1.04); }
.escena.final .collage { filter: blur(10px); opacity: .32; }

.foto {
  position: relative; min-height: 0; min-width: 0;
  background: var(--papel);
  padding: 6px 6px 16px;
  box-shadow: 0 10px 24px rgba(110, 100, 170, .22);
  border-radius: 3px;
  opacity: 0;
  transform: translateY(26px) rotate(var(--r, 0deg)) scale(.86);
  transition: opacity .9s ease, transform .9s cubic-bezier(.2, .8, .2, 1);
  transition-delay: calc(var(--i) * 320ms);
}
.collage.vista .foto { opacity: 1; transform: rotate(var(--r, 0deg)); }
.foto.ancha { grid-column: 1 / -1; }
.foto .marco { position: absolute; inset: 6px 6px 16px; overflow: hidden; background: var(--lila); }
.foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.foto .vacia { width: 100%; height: 100%; display: grid; place-items: center; }
.foto:nth-child(odd) .vacia { background: linear-gradient(150deg, var(--lila), #eadffc); }
.foto:nth-child(even) .vacia { background: linear-gradient(150deg, var(--azul), #e3effd); }
.foto .vacia svg { width: 34%; max-width: 54px; opacity: .55; }

/* Frases y pregunta */
.texto {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  text-align: center;
  padding-inline: 4px;
  pointer-events: none;
}
.frase, .pregunta { grid-area: 1 / 1; opacity: 0; transition: opacity 1s ease, transform 1.2s ease; }
.frase {
  font-family: var(--mano);
  font-weight: 600;
  font-size: clamp(2rem, 9.5vw, 3rem);
  line-height: 1.2;
  color: var(--tinta);
  text-wrap: balance;
  transform: translateY(12px);
  max-width: 14em;
}
.frase.on { opacity: 1; transform: none; }

.pregunta {
  display: grid; justify-items: center; gap: 22px;
  transform: translateY(14px) scale(.97);
  max-width: 100%;
}
.pregunta.on { opacity: 1; transform: none; }
.pregunta h1 {
  margin: 0;
  font-family: var(--display);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(2.3rem, 11vw, 3.6rem);
  line-height: 1.12;
  letter-spacing: -.01em;
  color: var(--tinta);
  text-wrap: balance;
  text-shadow: 0 0 28px rgba(253, 252, 255, .9), 0 0 8px rgba(253, 252, 255, .8);
}
.pregunta svg { width: 44px; height: 44px; animation: latido 2.2s ease-in-out infinite; }
@keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }

/* Corazones que suben al final */
.corazones { position: absolute; inset: 0; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 2s ease; }
.escena.final .corazones { opacity: 1; }
.corazones svg {
  position: absolute; bottom: -40px; opacity: 0;
  animation: subir var(--d) linear var(--delay) infinite;
}
@keyframes subir {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  12% { opacity: .7; }
  85% { opacity: .5; }
  100% { transform: translateY(-112svh) translateX(var(--x)); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .foto, .collage, .frase, .pregunta { transition-duration: .01s; transition-delay: 0s; }
  .pregunta svg, .corazones svg { animation: none; }
  .corazones { display: none; }
}
</style>

<main class="escena" id="escena" aria-live="polite">
  <div class="bruma" aria-hidden="true"><i></i><i></i></div>
  <section class="collage" id="collage" aria-label="Fotos"></section>
  <div class="corazones" id="corazones" aria-hidden="true"></div>
  <div class="texto">
    <p class="frase" id="frase"></p>

    </div>
  </div>
</main>

var MARCOS_DE_EJEMPLO = 6;

// Tus frases, en orden.
var FRASES = ["No eres mi mundo… pero cuando volteo a mirarlo, en todos los lados… estás tú", "Tú conmigo, yo contigo y Dios con nosotros…", "Te amo mucho muy demasiado", "En ti siento el amor de Dios", "Por eso Babyboo, te pregunto…"];

var PREGUNTA = "¿Te gustaría ser mi novia?";
/* ==================================== */

var escena = document.getElementById("escena");
var collage = document.getElementById("collage");
var frase = document.getElementById("frase");
var pregunta = document.getElementById("pregunta");
document.getElementById("textoPregunta").textContent = PREGUNTA;

var CORAZON = '<svg viewBox="0 0 24 24" width="SZ" height="SZ"><path fill="COL" d="M12 21s-7.5-4.6-9.6-9.3C.8 8.2 2.7 4.5 6.3 4.5c2 0 3.7 1.1 4.7 2.7h2c1-1.6 2.7-2.7 4.7-2.7 3.6 0 5.5 3.7 3.9 7.2C19.5 16.4 12 21 12 21z"/></svg>';
var giros = [-4, 3, 2, -3, -2, 4, 3, -4, 2, -3];

/* Collage */
var total = FOTOS.length || MARCOS_DE_EJEMPLO;
var filas = Math.ceil(total / 2);
collage.style.gridTemplateRows = "repeat(" + filas + ", minmax(0, 1fr))";
for (var i = 0; i < total; i++) {
  var f = document.createElement("div");
  f.className = "foto";
  f.style.setProperty("--i", i);
  f.style.setProperty("--r", giros[i % giros.length] + "deg");
  if (total % 2 === 1 && i === total - 1) f.className += " ancha";
  var marco = document.createElement("div");
  marco.className = "marco";
  if (FOTOS[i]) {
    var im = document.createElement("img");
    im.src = FOTOS[i]; im.alt = ""; im.decoding = "async";
    marco.appendChild(im);
  } else {
    marco.innerHTML = '<div class="vacia">' + CORAZON.replace(/SZ/g, "40").replace("COL", "#fdfcff") + "</div>";
  }
  f.appendChild(marco);
  collage.appendChild(f);
}

/* Corazones del final */
var capa = document.getElementById("corazones");
for (var k = 0; k < 12; k++) {
  var s = 14 + Math.round(Math.random() * 16);
  var col = k % 2 ? "#b8a5ec" : "#8fb9ea";
  var holder = document.createElement("div");
  holder.innerHTML = CORAZON.replace(/SZ/g, s).replace("COL", col);
  var sv = holder.firstChild;
  sv.style.left = (4 + Math.random() * 90) + "%";
  sv.style.setProperty("--d", (9 + Math.random() * 7) + "s");
  sv.style.setProperty("--delay", (Math.random() * 8) + "s");
  sv.style.setProperty("--x", (Math.random() * 60 - 30) + "px");
  capa.appendChild(sv);
}

/* Secuencia (tocar la pantalla adelanta la espera) */
var liberar = null;
function esperar(ms) {
  return new Promise(function (ok) {
    var t = setTimeout(done, ms);
    function done() { clearTimeout(t); liberar = null; ok(); }
    liberar = done;
  });
}
document.addEventListener("pointerdown", function () { if (liberar) liberar(); });

async function secuencia() {
  await esperar(700);
  collage.classList.add("vista");
  await esperar(total * 320 + 4600);
  escena.classList.add("tenue");
  await esperar(1300);
  for (var n = 0; n < FRASES.length; n++) {
    frase.textContent = FRASES[n];
    frase.classList.add("on");
    await esperar(3600);
    frase.classList.remove("on");
    await esperar(1000);
  }
  escena.classList.add("final");
  pregunta.classList.add("on");
}
secuencia();
